<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>The Classroom Builder — Goal Programming Simulator</title>
<meta name="description" content="Interactive drag-and-drop preschool classroom assignment simulator visualizing Goal Programming / multi-objective optimization.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #0f172a;
  --panel: #1e293b;
  --panel-raised: #253044;
  --border: rgba(255,255,255,0.08);
  --border-active: rgba(249,115,22,0.5);
  --primary: #f97316;
  --primary-light: #fb923c;
  --primary-dark: #ea6c0a;
  --green: #22c55e;
  --green-bg: rgba(34,197,94,0.12);
  --yellow: #eab308;
  --yellow-bg: rgba(234,179,8,0.12);
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.12);
  --blue: #3b82f6;
  --blue-bg: rgba(59,130,246,0.12);
  --purple: #a855f7;
  --purple-bg: rgba(168,85,247,0.12);
  --teal: #14b8a6;
  --teal-bg: rgba(20,184,166,0.12);
  --slate: #94a3b8;
  --slate-light: #64748b;
  --cream: #f1f5f9;
  --cream-70: rgba(241,245,249,0.7);
  --cream-30: rgba(241,245,249,0.3);
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.10);
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --radius: 10px;
  --radius-sm: 7px;
  --radius-xs: 5px;
}
html{font-size:13px}
html, body { background: var(--bg) !important; }
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg) !important;color:var(--cream);overflow-x:hidden}
h1,h2,h3,h4{font-weight:600}

/* ── LAYOUT ── */
.app-header{
  background:linear-gradient(135deg, #1e293b 0%, #253044 100%);
  border-bottom:1px solid var(--border);
  color:#fff;padding:10px 24px;display:flex;align-items:center;gap:16px;
  position:relative;z-index:10;
}
.app-header h1{font-family:'Inter',sans-serif;font-size:1.15rem;font-weight:600;letter-spacing:0.12em;color:var(--cream);text-transform:uppercase}
.app-header .subtitle{font-family:'Inter',sans-serif;font-size:.8rem;font-weight:400;color:var(--slate);letter-spacing:0.08em}
.header-bar{width:8px;height:24px;background:var(--primary)}
.header-text-group{display:flex;align-items:baseline;gap:12px}
.app-container{display:flex;height:calc(100vh - 52px);gap:0}

/* Stat pills / Header pills */
.stat-pill{
  background:transparent;border:1px solid var(--glass-border);
  border-radius:3px;padding:4px 12px;font-size:.65rem;font-weight:500;
  letter-spacing:0.06em;color:var(--slate);
}
.stats-row{display:flex;gap:6px;padding:8px 0;}

/* LEFT PANEL */
.left-panel{
  width:220px;min-width:220px;background:var(--panel);border-right:1px solid var(--border);
  overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;
}
.panel-title{
  font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;
  color:var(--slate-light);padding-bottom:6px;border-bottom:1px solid var(--border);
  margin-bottom:8px;display:flex;align-items:center;
}
.resource-section{display:flex;flex-direction:column;gap:6px}

/* CARDS */
.card{
  background:var(--panel-raised);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;cursor:grab;transition:all 250ms cubic-bezier(0.16,1,0.32,1);position:relative;
  box-shadow:none;
}
.card:hover{border-color:var(--border-active);transform:translateY(-1px);box-shadow:var(--shadow-md);background:#2a3a50;}
.card.dragging{opacity:.4;transform:scale(.95)}
.card-name{font-weight:700;font-size:.82rem;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.card-badges{display:flex;flex-wrap:wrap;gap:3px}

/* Teacher card colors */
.card-teacher{border-left:3px solid var(--primary)}
.card-para{border-left:3px solid var(--teal)}
.card-student{border-left:3px solid #a855f7}
.card-student.assigned{opacity:.35;pointer-events:none;cursor:default}
.card-teacher.assigned{opacity:.35;pointer-events:none;cursor:default}
.card-para.assigned{opacity:.35;pointer-events:none;cursor:default}

/* BADGES */
.badge{
  font-size:.55rem;font-weight:700;padding:1px 5px;border-radius:2px;
  letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  border:1px solid currentColor;opacity:.85;background:transparent;
}
.badge-sped{color:#fca5a5;border-color:rgba(239,68,68,0.4)}
.badge-esl{color:#93c5fd;border-color:rgba(59,130,246,0.4)}
.badge-bilingual{color:#d8b4fe;border-color:rgba(168,85,247,0.4)}
.badge-ec{color:#86efac;border-color:rgba(34,197,94,0.4)}
.badge-iep{color:#fca5a5;border-color:rgba(239,68,68,0.4)}
.badge-boy{color:#93c5fd;border-color:rgba(59,130,246,0.4)}
.badge-girl{color:#f9a8d4;border-color:rgba(236,72,153,0.4)}

.at-risk-bar{
  height:4px;border-radius:4px;margin-top:4px;background:var(--glass-border);overflow:hidden;
}
.at-risk-fill{height:100%;border-radius:4px;transition:width .3s}
/* Override inline styles for at-risk colors */
.at-risk-fill[style*="#ef4444"] { background: var(--primary) !important; }
.at-risk-fill[style*="#eab308"] { background: var(--yellow) !important; }
.at-risk-fill[style*="#22c55e"] { background: var(--green) !important; }

.at-risk-label{font-size:.6rem;color:var(--slate);font-weight:600;margin-top:2px}

/* CENTER PANEL */
.center-panel{
  flex:1;overflow-y:auto;padding:12px;
  background:var(--bg);
}
.classroom-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
}
.classroom-slot{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px;min-height:160px;transition:all 250ms cubic-bezier(0.16,1,0.32,1);
  box-shadow:none;display:flex;flex-direction:column;position:relative;
}
.classroom-slot.drag-over{
  border-color:var(--primary);background:rgba(249,115,22,0.06);
  box-shadow:0 0 0 2px rgba(249,115,22,0.15);
}
.classroom-slot.violation{
  border-color:var(--red);background:var(--red-bg);
}
.classroom-slot.warning{
  border-color:var(--yellow);background:var(--yellow-bg);
}
.classroom-slot.has-students:not(.violation):not(.warning) {
  border-color:rgba(249,115,22,0.25);background:var(--panel);
}
.classroom-slot.truly-empty {
  border-style:dashed;border-color:rgba(255,255,255,0.06);background:rgba(255,255,255,0.01);opacity:0.75;
}

@keyframes pulse-red{
  0%,100%{box-shadow:0 0 0 2px rgba(239,68,68,.2)}
  50%{box-shadow:0 0 0 5px rgba(239,68,68,.3)}
}
.room-header{
  display:flex;align-items:baseline;justify-content:flex-start;gap:8px;
  margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--border);
}
.room-label{font-family:'Inter',sans-serif;font-weight:600;font-size:.72rem;letter-spacing:.1em;color:var(--cream);text-transform:uppercase}
.room-type{color:var(--slate-light);font-size:.65rem;font-weight:400;letter-spacing:.05em}

.teacher-slot{
  border:1px dashed rgba(249,115,22,0.25);background:rgba(249,115,22,0.04);
  color:var(--slate-light);border-radius:var(--radius-xs);
  min-height:28px;padding:4px 6px;margin-bottom:4px;font-size:.7rem;
  display:flex;align-items:center;gap:4px;transition:all .2s;
}
.teacher-slot.filled{border-style:solid;border-color:rgba(249,115,22,0.4);background:rgba(249,115,22,0.08);color:var(--cream);}
.para-slot{
  border:1px dashed rgba(20,184,166,.25);background:rgba(20,184,166,.04);
  border-radius:var(--radius-xs);min-height:22px;
  padding:3px 6px;margin-bottom:4px;font-size:.65rem;color:var(--slate-light);
  display:flex;align-items:center;gap:3px;flex-wrap:wrap;transition:all .2s;
}
.para-chip{
  background:rgba(20,184,166,0.15);color:#5eead4;
  font-size:.6rem;font-weight:700;
  padding:2px 6px;border-radius:12px;display:flex;align-items:center;gap:3px;
}
.para-chip .remove-btn{cursor:pointer;font-size:.7rem;margin-left:2px;opacity:.6}
.para-chip .remove-btn:hover{opacity:1;color:var(--red)}

.student-area{
  flex:1;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;min-height:30px;
  background:rgba(255,255,255,0.02);border:1px dashed rgba(168,85,247,0.2);
  border-radius:var(--radius-xs);padding:4px;transition:all .2s;
}
.student-chip{
  border-radius:8px;font-size:.55rem;font-weight:700;padding:2px 5px;
  display:flex;align-items:center;gap:2px;cursor:default;position:relative;
  transition:all .3s ease;
}
.student-chip.iep{background:rgba(239,68,68,0.15);color:#fca5a5}
.student-chip.esl{background:rgba(59,130,246,0.15);color:#93c5fd}
.student-chip.general{background:rgba(255,255,255,0.07);color:var(--cream-70)}
.student-chip.high-risk{background:rgba(234,179,8,0.15);color:#fde047;border:1px solid rgba(234,179,8,0.25)}
.student-chip .remove-btn{cursor:pointer;font-size:.65rem;margin-left:2px;opacity:.5}
.student-chip .remove-btn:hover{opacity:1;color:var(--red)}

.mini-scorecard{
  margin-top:auto;padding-top:5px;border-top:1px solid var(--border);
  font-family:'Fira Code',monospace;font-size:.58rem;color:var(--slate);text-align:center;letter-spacing:-.02em;
}

.violation-msg{
  position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:var(--panel-raised);color:var(--cream);font-size:.6rem;padding:4px 8px;border-radius:6px;
  border:1px solid var(--border);
  white-space:nowrap;z-index:100;pointer-events:none;
  animation:fadeInUp .3s ease;
}
@keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(4px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* RIGHT PANEL */
.right-panel{
  width:260px;min-width:260px;background:var(--panel);border-left:1px solid var(--border);
  overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;
}
.penalty-meter{
  background:linear-gradient(135deg,#0f172a,#1a2540);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;text-align:center;
}
.penalty-label{font-family:'Inter',sans-serif;font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.15em;color:var(--slate-light);margin-bottom:4px}
.penalty-score{
  font-family:'Fira Code',monospace;font-weight:400;font-size:2.8rem;
  color:var(--primary);line-height:1.1;transition:all .5s ease;
}
.penalty-sublabel{font-family:'Inter',sans-serif;font-style:italic;font-weight:300;font-size:.62rem;color:var(--slate-light);margin-top:4px}
.penalty-score.dropping{animation:scorePulse .4s ease;}
.penalty-bar-outer{
  height:3px;background:rgba(255,255,255,0.08);border-radius:3px;margin-top:8px;overflow:hidden;
}
.penalty-bar-inner{height:100%;border-radius:3px;transition:width .6s ease,background .6s ease;}

.breakdown-section{display:flex;flex-direction:column;gap:8px}
.breakdown-title{font-family:'Inter',sans-serif;font-size:.62rem;font-weight:600;color:var(--slate-light);text-transform:uppercase;letter-spacing:.14em;border-left:2px solid var(--primary);padding-left:6px;margin-bottom:8px}

.action-buttons{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btn{
  padding:12px 16px;border:none;border-radius:3px;font-family:inherit;
  font-weight:800;font-size:.85rem;cursor:pointer;transition:all .2s ease;
  text-transform:uppercase;letter-spacing:.5px;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn:active{transform:translateY(0)}

.btn-optimize{
  background:var(--primary);color:#0f172a;font-family:'Inter',sans-serif;
  font-weight:700;letter-spacing:.12em;border-radius:3px;
  box-shadow:0 4px 20px rgba(249,115,22,0.25);
  padding:14px;border:none;cursor:pointer;transition:all .2s ease;
  text-transform:uppercase;font-size:.78rem;
}
.btn-optimize:hover{
  background:var(--primary-light);
  box-shadow:0 6px 24px rgba(249,115,22,0.35);transform:translateY(-1px);
}
.btn-optimize.running{opacity:.7;pointer-events:none}
.btn-reset{
  background:var(--glass);border:1px solid var(--glass-border);
  color:var(--cream-70);font-family:'Inter',sans-serif;border-radius:3px;font-size:.72rem;letter-spacing:.10em;
}
.btn-reset:hover{background:rgba(255,255,255,0.08)}

/* Optimizer animation */
.student-chip.flying{animation:flyIn .6s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes flyIn{
  0%{opacity:0;transform:scale(0) translateY(-20px)}
  60%{opacity:1;transform:scale(1.2) translateY(0)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
.teacher-slot.fly-in,.para-chip.fly-in{
  animation:flyIn .5s cubic-bezier(.34,1.56,.64,1) forwards;
}

/* Scrollbar styling */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}

/* Remove button for teacher */
.teacher-remove{
  cursor:pointer;margin-left:auto;font-size:.75rem;opacity:.4;transition:all .15s;
}
.teacher-remove:hover{opacity:1;color:var(--red)}

/* Section divider */
.section-divider{height:1px;background:var(--border);margin:4px 0}

/* Empty state */
.empty-hint{font-size:.6rem;color:#b0b8c4;font-style:italic;text-align:center;padding:6px}

/* ── SCENARIO STYLES ── */
.btn-absent{
  background:var(--red-bg);color:#fca5a5;border:1px solid rgba(239,68,68,0.25);border-radius:6px;
  padding:2px 6px;font-size:.55rem;font-weight:700;cursor:pointer;font-family:inherit;
  transition:all .15s;margin-left:4px;
}
.btn-absent:hover{background:#fca5a5;color:#991b1b}
.btn-auto-cover{
  background:var(--blue-bg);color:#93c5fd;border:1px solid rgba(59,130,246,0.25);border-radius:6px;
  padding:2px 6px;font-size:.55rem;font-weight:700;cursor:pointer;font-family:inherit;
  transition:all .15s;
}
.btn-auto-cover:hover{background:#93c5fd;color:#1d4ed8}
.btn-split{
  background:var(--yellow-bg);color:#fde047;border:1px solid rgba(234,179,8,0.25);border-radius:6px;
  padding:2px 6px;font-size:.55rem;font-weight:700;cursor:pointer;font-family:inherit;
  transition:all .15s;
}
.btn-split:hover{background:#fcd34d;color:#92400e}

.absent-banner{
  background:var(--red-bg);border:1.5px solid rgba(239,68,68,0.3);border-radius:6px;
  padding:4px 8px;font-size:.6rem;font-weight:700;color:#fca5a5;
  text-align:center;animation:pulse-red .8s ease infinite;
}
.absent-actions{display:flex;gap:4px;margin-top:4px;justify-content:center}
.student-chip.absent{opacity:.35;text-decoration:line-through;filter:grayscale(1)}

.ratio-note{
  font-size:.5rem;font-weight:700;padding:2px 5px;border-radius:8px;
  margin-top:2px;text-align:center;animation:fadeInUp .3s ease;
}
.ratio-note.improved{background:var(--green-bg);color:#86efac}
.ratio-note.worsened{background:var(--yellow-bg);color:#fde047}

.btn-enroll{
  background:var(--primary);color:#0f172a;font-weight:600;border:none;
  border-radius:3px;letter-spacing:0.08em;padding:8px 12px;font-family:inherit;
  font-size:.72rem;cursor:pointer;transition:all .2s;width:100%;text-transform:uppercase;
}
.btn-enroll:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-hire{
  background:var(--green);color:#0f172a;border:none;
  border-radius:3px;padding:8px 12px;font-family:inherit;
  font-weight:600;font-size:.72rem;cursor:pointer;transition:all .2s;
  width:100%;text-transform:uppercase;letter-spacing:0.08em;
}
.btn-hire:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}

.enrollment-counter{
  background:transparent;border:1px solid rgba(249,115,22,0.4);color:var(--primary);
  border-radius:3px;padding:4px 12px;font-size:.65rem;font-weight:500;
  display:inline-flex;align-items:center;gap:4px;letter-spacing:0.06em;
}
.crisis-banner{
  background:var(--red-bg);border:2px solid rgba(239,68,68,0.3);border-radius:var(--radius-sm);
  padding:10px;font-size:.7rem;font-weight:700;color:#fca5a5;text-align:center;
  animation:pulse-red .8s ease infinite;
}
.sub-pool{
  background:var(--glass);border:1px solid rgba(234,179,8,0.2);border-radius:var(--radius-sm);
  padding:8px;margin-top:4px;
}
.sub-pool-title{font-size:.7rem;font-weight:800;color:var(--yellow);margin-bottom:4px}
.birthday-badge{
  background:var(--yellow-bg);border:1px solid rgba(234,179,8,0.25);color:#fde047;
  font-size:.55rem;font-weight:700;padding:1px 5px;border-radius:10px;
  display:inline-flex;align-items:center;gap:2px;
}
.scenario-section{
  background:var(--glass);border:1px solid var(--glass-border);
  border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px;
}
.scenario-title{font-size:.68rem;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.5px}
.scenario-section p{color:var(--slate);font-size:.62rem}

/* ── FORMULATION MODAL ── */
.formulation-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;
  background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;
  animation:fadeInModal .3s ease;
}
@keyframes fadeInModal{from{opacity:0}to{opacity:1}}
.formulation-modal{
  background:#0a1628;border:1px solid rgba(249,115,22,0.2);border-radius:16px;
  padding:32px 36px;max-width:720px;width:90%;max-height:85vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);position:relative;
}
.formulation-modal h2{
  font-family:'Inter',sans-serif;font-size:1.1rem;font-weight:600;color:#e2e8f0;
  margin-bottom:6px;letter-spacing:.5px;
}
.formulation-modal .fm-sub{
  font-size:.75rem;color:#94a3b8;margin-bottom:18px;
}
.formulation-modal pre{
  font-family:'Fira Code',monospace;font-size:.72rem;line-height:1.9;
  color:#e2e8f0;white-space:pre-wrap;margin:0;
}
.formulation-modal pre .fm-keyword{color:#6366f1;font-weight:600}
.formulation-modal pre .fm-var{color:#d97706}
.formulation-modal pre .fm-comment{color:#64748b;font-style:italic}
.formulation-modal pre .fm-constraint{color:#22c55e}
.formulation-modal pre .fm-weight{color:#f97316;font-weight:600}
.fm-close{
  position:absolute;top:16px;right:18px;background:none;border:none;
  color:#94a3b8;font-size:1.2rem;cursor:pointer;padding:4px 8px;
}
.fm-close:hover{color:#fff}
.fm-divider{height:1px;background:rgba(99,102,241,.2);margin:14px 0}

/* ── SOLVER STATUS ── */
.solver-status{
  background:var(--glass);border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:.6rem;
  display:flex;flex-direction:column;gap:4px;
}
.solver-status .ss-row{display:flex;justify-content:space-between;align-items:center}
.solver-status .ss-label{font-weight:600;color:var(--slate-light);text-transform:uppercase;letter-spacing:.5px}
.solver-status .ss-value{font-weight:700;color:var(--cream);font-family:'Fira Code',monospace}
.solver-status .ss-value.optimal{color:#22c55e}
.solver-status .ss-value.fallback{color:#eab308}

.btn-model{
  background:transparent;border:1px solid rgba(249,115,22,0.3);
  color:var(--primary);
  border-radius:3px;padding:8px 12px;font-family:'Inter',sans-serif;
  font-weight:700;font-size:.68rem;cursor:pointer;transition:all .2s;
  width:100%;text-align:center;letter-spacing:.12em;text-transform:uppercase;
}
.btn-model:hover{background:rgba(249,115,22,0.08);}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/glpk.js/dist/glpk.min.js"></script>
<script>
// Initialize GLPK — wrapper handles async WASM fetch + XHR patching
window.__glpk_promise = (typeof GLPK === 'function')
  ? GLPK()

// ──────────────────────────────────────────────
// CONSTRAINT CHECKING
// ──────────────────────────────────────────────
function getRoomType(room) {
  return room.type;
}

function checkHardConstraints(room) {
  const violations = [];
  if (room.students.length === 0 && !room.teacher) return violations;

  // Students but no teacher
  if (room.students.length > 0 && !room.teacher) {
    violations.push('No teacher assigned');
  }

  // Teacher must have Early Childhood (all do in our data, but check anyway)
  if (room.teacher && !room.teacher.certs.includes('Early Childhood')) {
    violations.push('Teacher needs Early Childhood cert');
  }

  const hasIEP = room.students.some(s => s.tags.includes('IEP'));
  const hasESL = room.students.some(s => s.tags.includes('ESL'));
  const hasBilingual = room.students.some(s => s.tags.includes('Bilingual'));

  // IEP students need SpEd certified teacher
  if (hasIEP && room.teacher && !room.teacher.certs.includes('SpEd')) {
    violations.push('IEP students need SpEd certified teacher');
  }

  // ESL/Bilingual students need ESL or Bilingual cert on teacher or para
  if ((hasESL || hasBilingual) && room.teacher) {
    const teacherHas = room.teacher.certs.includes('ESL') || room.teacher.certs.includes('Bilingual');
    const paraHas = room.paras.some(p => p.certs.includes('Bilingual') || p.certs.includes('ESL'));
    if (!teacherHas && !paraHas) {
      violations.push('ESL/Bilingual students need certified staff');
    }
  }

  const type = getRoomType(room);
  const adultCount = (room.teacher ? 1 : 0) + room.paras.length;

  if (type === 'IEP_ONLY') {
    if (room.students.length > room.maxStudents) violations.push(`IEP room max ${room.maxStudents} students`);
    if (adultCount > 0 && room.students.length > adultCount * 6) {
      violations.push('IEP room: need 1 adult per 6 students');
    }
  }

  if (type === 'BLENDED') {
    if (room.students.length > room.maxStudents) violations.push(`Blended room max ${room.maxStudents} students`);
    const iepCount = room.students.filter(s => s.tags.includes('IEP')).length;
    const iepPct = iepCount / room.students.length;
    if (iepPct > 0.3) violations.push('Blended room: IEP must be ≤30%');
  }

  // C5: Teacher contract cap
  if (room.teacher && room.students.length > room.teacher.contractCap) {
    violations.push(`Teacher contract cap exceeded (max ${room.teacher.contractCap})`);
  }

  return violations;
}

// ──────────────────────────────────────────────
// PENALTY SCORING (soft constraints)
// ──────────────────────────────────────────────
function computePenalty(classrooms, weights) {
  const occupied = classrooms.filter(r => r.students.length > 0);
  if (occupied.length === 0) return { total:100, ratioImbalance:0, genderImbalance:0, highNeeds:0, iepSpread:0, bilingualMatch:0, atRiskBalance:0, inclusionPenalty:0, reluctancePenalty:0 };

  // 1. Student/adult ratio balance
  let ratioImbalance = 0;
  const ratios = occupied.map(r => {
    const adults = (r.teacher ? 1 : 0) + r.paras.length;
    return adults > 0 ? r.students.length / adults : r.students.length * 3;
  });
  if (ratios.length > 1) {
    const avgRatio = ratios.reduce((a,b) => a+b, 0) / ratios.length;
    ratioImbalance = ratios.reduce((sum, r) => sum + Math.abs(r - avgRatio), 0) / ratios.length;
    ratioImbalance = Math.min(ratioImbalance * 4, 25);
  }

  // 2. Gender balance
  let genderImbalance = 0;
  occupied.forEach(r => {
    const boys = r.students.filter(s => s.gender === 'boy').length;
    const girls = r.students.filter(s => s.gender === 'girl').length;
    const total = boys + girls;
    if (total > 1) {
      genderImbalance += Math.abs(boys - girls) / total;
    }
  });
  genderImbalance = Math.min((genderImbalance / Math.max(occupied.length,1)) * 40, 25);

  // 3. High at-risk concentration
  let highNeeds = 0;
  const roomRisks = occupied.map(r => r.students.reduce((sum, s) => sum + s.atRisk, 0));
  if (roomRisks.length > 0) {
    const maxRisk = Math.max(...roomRisks);
    const avgRisk = roomRisks.reduce((a,b) => a+b,0) / roomRisks.length;
    highNeeds = avgRisk > 0 ? Math.min(((maxRisk - avgRisk) / avgRisk) * 15, 25) : 0;
  }

  // 4. IEP spread
  let iepSpread = 0;
  const iepCounts = occupied.map(r => r.students.filter(s => s.tags.includes('IEP')).length);
  if (iepCounts.some(c => c > 0)) {
    const maxIEP = Math.max(...iepCounts);
    iepSpread = Math.min(maxIEP * 4, 25);
  }

  // 5. Bilingual matching
  let bilingualMatch = 0;
  occupied.forEach(r => {
    const biStudents = r.students.filter(s => s.tags.includes('Bilingual') || s.tags.includes('ESL'));
    if (biStudents.length > 0) {
      const staffBi = (r.teacher && (r.teacher.certs.includes('Bilingual') || r.teacher.certs.includes('ESL'))) ||
                       r.paras.some(p => p.certs.includes('Bilingual'));
      if (!staffBi) bilingualMatch += biStudents.length * 3;
    }
  });
  bilingualMatch = Math.min(bilingualMatch, 25);

  // Goal 5: At-risk score balance
  const totalRisk = occupied.reduce((sum,r) => 
    sum + r.students.reduce((s2,st) => s2 + st.atRisk, 0), 0);
  const idealRisk = occupied.length > 0 ? totalRisk / occupied.length : 0;
  let atRiskBalance = 0;
  occupied.forEach(r => {
    const roomRisk = r.students.reduce((s,st) => s + st.atRisk, 0);
    atRiskBalance += Math.abs(roomRisk - idealRisk);
  });
  atRiskBalance = Math.min((atRiskBalance / Math.max(occupied.length,1)) 
    * (weights?.w5 || 3) * 0.5, 25);

  // Goal 6: Inclusion preference (penalize 100% IEP segregated rooms)
  let inclusionPenalty = 0;
  occupied.forEach(r => {
    const allIEP = r.students.length > 0 && 
      r.students.every(s => s.tags.includes('IEP'));
    if (allIEP) inclusionPenalty += (weights?.w6 || 1) * 5;
  });
  inclusionPenalty = Math.min(inclusionPenalty, 25);

  // Goal 8: Staff willingness/reluctance
  let reluctancePenalty = 0;
  occupied.forEach(r => {
    const highNeedsCount = r.students.filter(s => s.atRisk >= 15).length;
    if (highNeedsCount > 3 && r.teacher && r.teacher.willingness < 3) {
      reluctancePenalty += (weights?.w8 || 2) * (3 - r.teacher.willingness);
    }
  });
  reluctancePenalty = Math.min(reluctancePenalty * 3, 25);

  const total = Math.round(ratioImbalance + genderImbalance + highNeeds + iepSpread + bilingualMatch + atRiskBalance + inclusionPenalty + reluctancePenalty);
  return { 
    total: Math.min(total, 100), 
    ratioImbalance: Math.round(ratioImbalance), 
    genderImbalance: Math.round(genderImbalance), 
    highNeeds: Math.round(highNeeds), 
    iepSpread: Math.round(iepSpread), 
    bilingualMatch: Math.round(bilingualMatch),
    atRiskBalance: Math.round(atRiskBalance),
    inclusionPenalty: Math.round(inclusionPenalty),
    reluctancePenalty: Math.round(reluctancePenalty)
  };
}

// ──────────────────────────────────────────────
// OPTIMIZER — GLPK.js Goal Programming (2-stage)
// ──────────────────────────────────────────────

// Stage 2 helper: marginal student penalty for a room
function computeStudentPenalty(room, weights, idealAtRiskSum, isReoptimization, currentClassrooms) {
  const n = room.students.length;
  if (n === 0) return 0;
  let p = 0;

  // Gender balance (legacy heuristic)
  const boys = room.students.filter(s => s.gender === 'boy').length;
  p += 2 * Math.abs(boys - n / 2) / n * 10;

  // IEP spread (legacy heuristic to avoid over-concentration in general classes)
  const iepCount = room.students.filter(s => s.tags.includes('IEP')).length;
  const iepRatio = iepCount / n;
  p += 5 * Math.abs(iepRatio - 0.15) * 10;

  // Goal 5: At-risk score balance
  const roomRiskSum = room.students.reduce((sum, s) => sum + s.atRisk, 0);
  p += (weights.w5 || 3) * Math.abs(roomRiskSum - idealAtRiskSum);

  // Goal 6: Inclusion preference
  const isSegregated = (iepCount === n && n > 0) ? 1 : 0;
  p += (weights.w6 || 1) * isSegregated * 50;

  // Goal 7: Mid-year continuity
  if (isReoptimization && currentClassrooms) {
    let continuityBreaks = 0;
    for (const student of room.students) {
      const prevRoom = currentClassrooms.find(r => r.students.some(s => s.id === student.id));
      if (prevRoom && prevRoom.id !== room.id) {
        continuityBreaks += 1;
      }
    }
    p += (weights.w7 || 4) * continuityBreaks * 50;
  }

  // Goal 8: Staff willingness/reluctance
  const highNeedsCount = room.students.filter(s => s.atRisk >= 15).length;
  if (highNeedsCount > 3 && room.teacher && room.teacher.willingness < 3) {
    p += (weights.w8 || 2) * (3 - room.teacher.willingness) * 20;
  }

  return p;
}

// Stage 2: greedy student placement (seeded by ILP staff assignment)
function placeStudents(rooms, students, weights, currentClassrooms, isReoptimization) {
  // Sort students: C6 mandatory first, then IEP, then ESL, then at-risk
  const sorted = [...students].sort((a, b) => {
    // C6: Turn-3 IEP legal entitlement priority
    const aC6 = (a.tags.includes('IEP') && a.turnsThreeToday) ? 1 : 0;
    const bC6 = (b.tags.includes('IEP') && b.turnsThreeToday) ? 1 : 0;
    if (aC6 !== bC6) return bC6 - aC6;

    const aHasIEP = a.tags.includes('IEP') ? 1 : 0;
    const bHasIEP = b.tags.includes('IEP') ? 1 : 0;
    if (aHasIEP !== bHasIEP) return bHasIEP - aHasIEP;

    const aHasESL = a.tags.includes('ESL') ? 1 : 0;
    const bHasESL = b.tags.includes('ESL') ? 1 : 0;
    if (aHasESL !== bHasESL) return bHasESL - aHasESL;

    return b.atRisk - a.atRisk;
  });

  const totalAtRiskPoints = students.reduce((sum, s) => sum + s.atRisk, 0);
  const idealAtRiskSum = totalAtRiskPoints / rooms.length;

  for (const student of sorted) {
    let bestRoom = null;
    let bestDelta = Infinity;
    const isC6 = student.tags.includes('IEP') && student.turnsThreeToday;

    for (const room of rooms) {
      if (!room.teacher) continue;
      const testRoom = { ...room, students: [...room.students, student] };
      const violations = checkHardConstraints(testRoom);
      
      // C6 students must be placed regardless of constraints if no valid room
      // But we still try to find valid rooms first.
      if (violations.length > 0 && !isC6) continue;

      const before = computeStudentPenalty(room, weights, idealAtRiskSum, isReoptimization, currentClassrooms);
      room.students.push(student);
      const after = computeStudentPenalty(room, weights, idealAtRiskSum, isReoptimization, currentClassrooms);
      room.students.pop();

      const delta = after - before;
      if (delta < bestDelta) {
        bestDelta = delta;
        bestRoom = room;
      }
    }
    
    // Fallback: If C6 student and no room evaluated favorably due to constraints blocking it
    // Wait, the above logic already let C6 bypass constraint skips.
    if (bestRoom) bestRoom.students.push(student);
  }
}

// Fallback: original greedy heuristic (used if GLPK fails)
function heuristicAssignment(teachers, paras, students, weights, currentClassrooms, isReoptimization) {
  const rooms = initClassrooms();
  const sorted = [...students].sort((a, b) => {
    const aS = (a.tags.includes('IEP') ? 100 : 0) + (a.tags.includes('ESL') ? 50 : 0) + a.atRisk;
    const bS = (b.tags.includes('IEP') ? 100 : 0) + (b.tags.includes('ESL') ? 50 : 0) + b.atRisk;
    return bS - aS;
  });
  const spedT = teachers.filter(t => t.certs.includes('SpEd'));
  const otherT = teachers.filter(t => !t.certs.includes('SpEd'));
  [...spedT, ...otherT].forEach((t, i) => { if (i < 20) rooms[i].teacher = t; });
  const biP = paras.filter(p => p.certs.includes('Bilingual'));
  const otherP = paras.filter(p => !p.certs.includes('Bilingual'));
  const ordP = [...biP, ...otherP];
  let pi = 0;
  const nonBi = rooms.filter(r => r.teacher && !r.teacher.certs.includes('ESL') && !r.teacher.certs.includes('Bilingual'));
  for (const para of ordP) {
    if (para.certs.includes('Bilingual') && nonBi.length > pi) {
      const rm = rooms.find(r => r.id === nonBi[pi].id);
      rm.paras.push(para);
    } else {
      const need = rooms.filter(r => r.teacher && r.paras.length === 0).sort((a, b) => a.id - b.id);
      if (need.length > 0) need[0].paras.push(para);
    }
    pi++;
  }
  placeStudents(rooms, sorted, weights, currentClassrooms, isReoptimization);
  return rooms;
}
// Stage 1: GLPK.js Goal Programming ILP for staff assignment
async function solveStaffAssignment(teachers, paras, rooms, currentClassrooms, weights, onStatus) {
  onStatus('formulating');
  const glpk = window.__glpk_instance || await window.__glpk_promise;
  if (!glpk) return { status: 'FALLBACK', reason: 'GLPK unavailable', varCount: 0, constraintCount: 0 };

  const T = teachers.length;
  const A = paras.length;
  const R = rooms.length;

  // Variable naming helpers
  const xName = (t, r) => `x_t${t}_r${r}`;
  const pName = (a, r) => `p_a${a}_r${r}`;

  // Collect binary vars
  const binaries = [];
  for (let t = 0; t < T; t++)
    for (let r = 0; r < R; r++)
      binaries.push(xName(t, r));
  for (let a = 0; a < A; a++)
    for (let r = 0; r < R; r++)
      binaries.push(pName(a, r));

  // Deviation variables (continuous >= 0) — named d_minus_{goalType}_r{r}
  const deviations = [];
  const objVars = [];
  const goalConstraints = [];

  // Goal 1: SpEd coverage — rooms with IEP students need SpEd teacher
  for (let r = 0; r < R; r++) {
    const roomDef = rooms[r];
    if (roomDef.type === 'IEP_ONLY' || roomDef.type === 'BLENDED') {
      const dName = `d_minus_sped_r${r}`;
      deviations.push(dName);
      objVars.push({ name: dName, coef: weights.w1 });
      // Σ_t x[t][r] * hasSpEd[t] + d_minus >= 1
      const vars = [];
      for (let t = 0; t < T; t++) {
        if (teachers[t].certs.includes('SpEd')) {
          vars.push({ name: xName(t, r), coef: 1 });
        }
      }
      vars.push({ name: dName, coef: 1 });
      goalConstraints.push({
        name: `g1_sped_r${r}`,
        vars: vars,
        bnds: { type: glpk.GLP_LO, lb: 1, ub: 0 }
      });
    }
  }

  // Goal 2: ESL/Bilingual coverage
  for (let r = 0; r < R; r++) {
    const roomDef = rooms[r];
    if (roomDef.isESL) {
      const dName = `d_minus_esl_r${r}`;
      deviations.push(dName);
      objVars.push({ name: dName, coef: weights.w2 });
      const vars = [];
      for (let t = 0; t < T; t++) {
        if (teachers[t].certs.includes('ESL') || teachers[t].certs.includes('Bilingual')) {
          vars.push({ name: xName(t, r), coef: 1 });
        }
      }
      for (let a = 0; a < A; a++) {
        if (paras[a].certs.includes('Bilingual')) {
          vars.push({ name: pName(a, r), coef: 1 });
        }
      }
      vars.push({ name: dName, coef: 1 });
      goalConstraints.push({
        name: `g2_esl_r${r}`,
        vars: vars,
        bnds: { type: glpk.GLP_LO, lb: 1, ub: 0 }
      });
    }
  }

  // Goal 3: Bilingual para distribution
  for (let r = 0; r < R; r++) {
    const roomDef = rooms[r];
    if (roomDef.isBilingual) {
      const dName = `d_minus_bil_r${r}`;
      deviations.push(dName);
      objVars.push({ name: dName, coef: weights.w3 });
      const vars = [];
      for (let a = 0; a < A; a++) {
        if (paras[a].certs.includes('Bilingual')) {
          vars.push({ name: pName(a, r), coef: 1 });
        }
      }
      vars.push({ name: dName, coef: 1 });
      goalConstraints.push({
        name: `g3_bil_r${r}`,
        vars: vars,
        bnds: { type: glpk.GLP_LO, lb: 1, ub: 0 }
      });
    }
  }

  // Goal 4: Para count per room
  for (let r = 0; r < R; r++) {
    const roomDef = rooms[r];
    const roomTypeMin = roomDef.type === 'IEP_ONLY' ? 2 : (roomDef.type === 'BLENDED' ? 1 : 0);
    const indCount = roomDef.students.filter(s => s.tags.includes('IEP') && s.requiresIndividualAdult).length;
    const requiredParas = Math.max(roomTypeMin, indCount);

    if (requiredParas > 0) {
      const dName = `d_minus_para_r${r}`;
      deviations.push(dName);
      objVars.push({ name: dName, coef: weights.w4 });
      const vars = [];
      for (let a = 0; a < A; a++) {
        vars.push({ name: pName(a, r), coef: 1 });
      }
      vars.push({ name: dName, coef: 1 });
      goalConstraints.push({
        name: `g4_para_r${r}`,
        vars: vars,
        bnds: { type: glpk.GLP_LO, lb: requiredParas, ub: 0 }
      });
    }
  }

  // Hard constraints
  const hardConstraints = [];

  // C1: Each teacher assigned to exactly one room
  for (let t = 0; t < T; t++) {
    const vars = [];
    for (let r = 0; r < R; r++) vars.push({ name: xName(t, r), coef: 1 });
    hardConstraints.push({
      name: `c1_teacher_${t}`,
      vars: vars,
      bnds: { type: glpk.GLP_FX, lb: 1, ub: 1 }
    });
  }

  // C2: Each room has at most one teacher (exactly one if we have enough teachers; <= 1 otherwise)
  for (let r = 0; r < R; r++) {
    const vars = [];
    for (let t = 0; t < T; t++) vars.push({ name: xName(t, r), coef: 1 });
    hardConstraints.push({
      name: `c2_room_${r}`,
      vars: vars,
      bnds: { type: glpk.GLP_UP, lb: 0, ub: 1 }
    });
  }

  // C3: Each para assigned to exactly one room
  for (let a = 0; a < A; a++) {
    const vars = [];
    for (let r = 0; r < R; r++) vars.push({ name: pName(a, r), coef: 1 });
    hardConstraints.push({
      name: `c3_para_${a}`,
      vars: vars,
      bnds: { type: glpk.GLP_FX, lb: 1, ub: 1 }
    });
  }

  // C4: Teachers without Early Childhood cert cannot be assigned (remove variables)
  // Enforced by fixing those variables to 0
  for (let t = 0; t < T; t++) {
    if (!teachers[t].certs.includes('Early Childhood')) {
      for (let r = 0; r < R; r++) {
        hardConstraints.push({
          name: `c4_nocert_t${t}_r${r}`,
          vars: [{ name: xName(t, r), coef: 1 }],
          bnds: { type: glpk.GLP_FX, lb: 0, ub: 0 }
        });
      }
    }
  }

  const model = {
    name: 'ClassroomStaffGP',
    objective: {
      direction: glpk.GLP_MIN,
      name: 'weighted_deviation',
      vars: objVars
    },
    subjectTo: [...hardConstraints, ...goalConstraints],
    binaries: binaries,
    // Deviation vars are continuous >= 0.  GLPK treats unlisted vars as continuous [0, +inf) by default.
  };

  const varCount = binaries.length + deviations.length;
  const constraintCount = hardConstraints.length + goalConstraints.length;

  onStatus('solving');

  // Solve with timeout
  let result;
  try {
    const start = Date.now();
    result = await glpk.solve(model, {
      msglev: glpk.GLP_MSG_OFF,
      cb: {
        call: () => {
          if (Date.now() - start > 1500) return true; // Abort after 1.5 seconds to prevent browser freeze
        },
        each: 10
      }
    });
  } catch (e) {
    return { status: 'FALLBACK', reason: e.message, varCount, constraintCount };
  }

  const status = result.result.status;
  if (status === glpk.GLP_OPT || status === glpk.GLP_FEAS) {
    // Extract assignments
    const teacherAssign = {}; // room index -> teacher
    const paraAssign = {};    // room index -> [paras]
    for (let r = 0; r < R; r++) paraAssign[r] = [];

    for (let t = 0; t < T; t++) {
      for (let r = 0; r < R; r++) {
        if (result.result.vars[xName(t, r)] > 0.5) {
          teacherAssign[r] = teachers[t];
        }
      }
    }
    for (let a = 0; a < A; a++) {
      for (let r = 0; r < R; r++) {
        if (result.result.vars[pName(a, r)] > 0.5) {
          paraAssign[r].push(paras[a]);
        }
      }
    }
    return {
      status: status === glpk.GLP_OPT ? 'OPTIMAL' : 'FEASIBLE',
      z: result.result.z,
      teacherAssign,
      paraAssign,
      varCount,
      constraintCount,
      solver: 'GLPK 4.65 (WebAssembly)'
    };
  }
  return { status: 'INFEASIBLE', varCount, constraintCount };
}

// Main async optimizer — called by the UI
async function optimizeAssignmentGP(teachers, paras, students, onStatus, weights, isReoptimization, currentClassrooms) {
  const rooms = initClassrooms();
  const result = await solveStaffAssignment(teachers, paras, rooms, currentClassrooms, weights, onStatus);

  if (result.status === 'OPTIMAL' || result.status === 'FEASIBLE') {
    // Apply ILP staff assignment
    for (let r = 0; r < rooms.length; r++) {
      rooms[r].teacher = result.teacherAssign[r] || null;
      rooms[r].paras = result.paraAssign[r] || [];
    }
    // Stage 2: greedy student placement
    onStatus('placing');
    placeStudents(rooms, students, weights, currentClassrooms, isReoptimization);
    return { rooms, solverResult: result };
  }

  // Fallback to heuristic
  onStatus('fallback');
  const fallbackRooms = heuristicAssignment(teachers, paras, students, weights, currentClassrooms, isReoptimization);
  return { rooms: fallbackRooms, solverResult: result };
}

function ClassroomSlot({ room, onDrop, onRemoveTeacher, onRemovePara, onRemoveStudent, onTeacherAbsent, onAutoCover, onSplitClass, onToggleStudentAbsent, absentStudents }) {
  const [dragOver, setDragOver] = useState(false);
  const [showViolation, setShowViolation] = useState(false);

  const presentStudents = useMemo(() => room.students.filter(s => !absentStudents.has(s.id)), [room.students, absentStudents]);
  const violations = useMemo(() => checkHardConstraints({...room, students: presentStudents}), [room, presentStudents]);
  const roomType = useMemo(() => getRoomType({...room, students: presentStudents}), [room, presentStudents]);

  const hasViolation = violations.length > 0;
  const iepCount = presentStudents.filter(s => s.tags.includes('IEP')).length;
  const iepPct = presentStudents.length > 0 ? Math.round((iepCount / presentStudents.length) * 100) : 0;
  const boys = presentStudents.filter(s => s.gender === 'boy').length;
  const girls = presentStudents.filter(s => s.gender === 'girl').length;
  const riskSum = presentStudents.reduce((s, st) => s + st.atRisk, 0);
  const adultCount = (room.teacher ? 1 : 0) + room.paras.length;
  const cap = room.type === 'IEP_ONLY' ? 13 : 20;

  const absentCount = room.students.filter(s => absentStudents.has(s.id)).length;
  const ratioImproved = absentCount > 0 && adultCount > 0 && presentStudents.length > 0 && (presentStudents.length / adultCount) < (room.students.length / adultCount);

  const indAdultsNeeded = presentStudents.filter(
    s => s.tags.includes('IEP') && s.requiresIndividualAdult
  ).length;

  const certOk = useMemo(() => {
    if (!room.teacher) return presentStudents.length === 0;
    const hasIEP = presentStudents.some(s => s.tags.includes('IEP'));
    const hasESL = presentStudents.some(s => s.tags.includes('ESL') || s.tags.includes('Bilingual'));
    if (hasIEP && !room.teacher.certs.includes('SpEd')) return false;
    if (hasESL) {
      const tc = room.teacher.certs.includes('ESL') || room.teacher.certs.includes('Bilingual');
      const pc = room.paras.some(p => p.certs.includes('Bilingual'));
      if (!tc && !pc) return false;
    }
    return true;
  }, [room, presentStudents]);

  const handleDragOver = (e) => { e.preventDefault(); setDragOver(true); };
  const handleDragLeave = () => setDragOver(false);
  const handleDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    try {
      const data = JSON.parse(e.dataTransfer.getData('text/plain'));
      onDrop(room.id, data);
    } catch(err) {}
  };

  const isEmpty = !room.teacher && room.paras.length === 0 && room.students.length === 0;
  const noTeacher = !room.teacher && room.students.length > 0;
  const isHasStudents = room.students.length > 0 || room.teacher;
  const isTrulyEmpty = room.students.length === 0 && !room.teacher && room.paras.length === 0;
  
  const slotClass = `classroom-slot ${dragOver ? 'drag-over' : ''} ${(hasViolation && !isEmpty) || noTeacher ? 'violation' : ''} ${isHasStudents ? 'has-students' : ''} ${isTrulyEmpty ? 'truly-empty' : ''}`;

  return (
    <div className={slotClass}
         onDragOver={handleDragOver}
         onDragLeave={handleDragLeave}
         onDrop={handleDrop}
         onMouseEnter={() => hasViolation && setShowViolation(true)}
         onMouseLeave={() => setShowViolation(false)}>

      {showViolation && violations.length > 0 && (
        <div className="violation-msg">{violations[0]}</div>
      )}

      <div className="room-header">
        <span className="room-label">ROOM {room.id.toString().padStart(2, '0')}</span>
        <span className={`room-type ${room.type === 'IEP_ONLY' ? 'iep-only' : 'blended'}`}>
          · {room.roomLabel ? room.roomLabel.toUpperCase() : (room.type === 'IEP_ONLY' ? 'IEP' : 'BLENDED')}
        </span>
      </div>

      <div className={`teacher-slot ${room.teacher ? 'filled' : ''}`}>
        {room.teacher ? (
          <>
            {room.teacher.name}
            {room.teacher.isSub && <span className="badge badge-esl" style={{marginLeft:3,fontSize:'.5rem'}}>SUB</span>}
            <span className="teacher-remove" onClick={() => onRemoveTeacher(room.id)}>✕</span>
            {room.students.length > 0 && (
              <button className="btn-absent" onClick={() => onTeacherAbsent(room.id)}>ABSENT</button>
            )}
          </>
        ) : <div style={{width:'100%', textAlign:'center', fontFamily:'monospace', fontSize:'0.65rem', color:'var(--slate-light)'}}>T</div>}
      </div>

      {noTeacher && (
        <div className="absent-banner">
          Room {room.id} — No Lead Teacher
          <div className="absent-actions">
            <button className="btn-auto-cover" onClick={() => onAutoCover(room.id)}>AUTO-COVER</button>
            <button className="btn-split" onClick={() => onSplitClass(room.id)}>SPLIT</button>
          </div>
        </div>
      )}

      <div className="para-slot">
        {room.paras.length > 0 ? room.paras.map(p => (
          <span key={p.id} className="para-chip">
            {p.name}
            <span className="remove-btn" onClick={() => onRemovePara(room.id, p.id)}>✕</span>
          </span>
        )) : <div style={{width:'100%', textAlign:'center', fontFamily:'monospace', fontSize:'0.65rem', color:'var(--slate-light)'}}>P</div>}
      </div>
      {room.type === 'IEP_ONLY' && room.paras.length < 2 && room.students.length > 0 && (
        <div style={{fontSize: '0.58rem', color: '#fca5a5', marginTop: '4px', textAlign: 'center'}}>
          Requires 2 paraprofessionals (state mandate)
        </div>
      )}

      <div className="student-area">
        {room.students.length > 0 ? room.students.map(s => {
          const isAbsent = absentStudents.has(s.id);
          const chipClass = s.tags.includes('IEP') ? 'iep' :
                            s.tags.includes('ESL') ? 'esl' :
                            s.atRisk >= 15 ? 'high-risk' : 'general';
          return (
            <span key={s.id}
                  className={`student-chip ${chipClass} ${isAbsent ? 'absent' : ''}`}
                  onClick={() => onToggleStudentAbsent(s.id)}
                  style={{cursor:'pointer'}}
                  title={isAbsent ? 'Click to mark present' : 'Click to mark absent'}>
              {s.gender === 'boy' ? '♂' : '♀'}{s.name}
              {s.isBirthday && <span style={{fontSize:'.5rem',background:'var(--yellow-bg)',color:'#fde047',padding:'1px 4px',borderRadius:'2px',marginLeft:'4px',fontWeight:700}}>BDAY</span>}
              <span className="remove-btn" onClick={(e) => { e.stopPropagation(); onRemoveStudent(room.id, s.id); }}>✕</span>
            </span>
          );
        }) : null}
      </div>

      {absentCount > 0 && ratioImproved && (
        <div className="ratio-note improved">Ratio improved ({presentStudents.length}:{adultCount})</div>
      )}

      {room.students.length > 0 && (
        <div className="mini-scorecard">
          {presentStudents.length}/{cap}&nbsp;&nbsp;IEP {iepPct}%&nbsp;&nbsp;♂{boys} ♀{girls}&nbsp;&nbsp;Risk:{riskSum}
          {indAdultsNeeded > 0 && <span style={{marginLeft: '8px'}}>1:1 Adults:<span style={{color: room.paras.length >= indAdultsNeeded ? 'var(--green)' : 'var(--red)'}}>{indAdultsNeeded}</span></span>}
        </div>
      )}
    </div>
  );
}

function BreakdownBar({ label, value, max, color }) {
  const pct = max > 0 ? Math.min((value / max) * 100, 100) : 0;
  const cleanLabel = label.replace(/^[^\w\s]+\s*/, '');

    <div style={{marginBottom:'10px'}}>

        <div style={{display:'flex', alignItems:'center', gap:'6px'}}>

        </div>
        <span style={{fontFamily:'"Fira Code", monospace', fontSize:'0.68rem', fontWeight:500, color: value === 0 ? 'var(--green)' : 'var(--red)'}}>

      </div>
      <div style={{height:'2px', background:'rgba(255,255,255,0.06)', borderRadius:'1px', overflow:'hidden', width:'100%'}}>
        <div style={{height:'100%', borderRadius:'1px', transition:'width 0.5s ease', width:`${pct}%`, background: color}}></div>
      </div>
    </div>
  );
}

function App() {
  const [classrooms, setClassrooms] = useState(initClassrooms);
  const [optimizing, setOptimizing] = useState(false);
  const [absentStudents, setAbsentStudents] = useState(new Set());
  const [extraStudents, setExtraStudents] = useState([]);
  const [extraTeachers, setExtraTeachers] = useState([]);
  const [subsUsed, setSubsUsed] = useState(new Set());
  const [enrollmentCount, setEnrollmentCount] = useState(BASE_ENROLLMENT);
  const [crisisBanner, setCrisisBanner] = useState(null);
  const [solverInfo, setSolverInfo] = useState(null);
  const [optimizerLabel, setOptimizerLabel] = useState('RUN OPTIMIZER');
  const [showFormulation, setShowFormulation] = useState(false);
  const [weights, setWeights] = useState({ w1:10, w2:8, w3:5, w4:7, w5:3, w6:1, w7:4, w8:2 });
  const scoreRef = useRef(null);

  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') setShowFormulation(false); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, []);

  const allTeachers = useMemo(() => [...TEACHERS, ...extraTeachers], [extraTeachers]);
  const allStudents = useMemo(() => [...INITIAL_STUDENTS, ...extraStudents], [extraStudents]);

  // Track which resources are assigned
  const assignedTeachers = useMemo(() => {
    const set = new Set();
    classrooms.forEach(r => { if(r.teacher) set.add(r.teacher.id); });
    return set;
  }, [classrooms]);

  const assignedParas = useMemo(() => {
    const set = new Set();
    classrooms.forEach(r => r.paras.forEach(p => set.add(p.id)));
    return set;
  }, [classrooms]);

  const assignedStudents = useMemo(() => {
    const set = new Set();
    classrooms.forEach(r => r.students.forEach(s => set.add(s.id)));
    return set;
  }, [classrooms]);


  const penalty = useMemo(() => computePenalty(classrooms), [classrooms]);

  // Unassigned counts
  const unassignedTeachers = allTeachers.filter(t => !assignedTeachers.has(t.id)).length;
  const unassignedParas = PARAS.filter(p => !assignedParas.has(p.id)).length;
  const unassignedStudents = allStudents.filter(s => !assignedStudents.has(s.id)).length;

  // Base penalty from unassigned resources
  const basePenalty = useMemo(() => {
    return unassignedStudents > 0 ? 100 : penalty.total;
  }, [unassignedStudents, penalty]);

  const displayPenalty = unassignedStudents > 0 ? 100 : penalty.total;

  // Available subs (not yet used)
  const availableSubs = SUBS.filter(s => !subsUsed.has(s.id) && !assignedTeachers.has(s.id));

  // Check if any room is at cap (for enrollment crisis)
  const allRoomsAtCap = useMemo(() => {
    const teacherRooms = classrooms.filter(r => r.teacher);
    if (teacherRooms.length === 0) return false;
    return teacherRooms.every(r => {
      const type = getRoomType(r);
      const cap = type === 'IEP_ONLY' ? 13 : 20;
      return r.students.length >= cap;
    });
  }, [classrooms]);

  const handleDrop = useCallback((roomId, data) => {
    setClassrooms(prev => {
      const next = prev.map(r => ({...r, teacher: r.teacher, paras:[...r.paras], students:[...r.students]}));
      const room = next.find(r => r.id === roomId);

      if (data.type === 'teacher') {
        const teacher = [...TEACHERS, ...SUBS, ...extraTeachers].find(t => t.id === data.id);
        if (!teacher) return prev;
        if (next.some(r => r.teacher && r.teacher.id === teacher.id)) return prev;
        if (room.teacher) return prev;
        room.teacher = teacher;
      } else if (data.type === 'para') {
        const para = PARAS.find(p => p.id === data.id);
        if (!para) return prev;
        if (next.some(r => r.paras.some(p => p.id === para.id))) return prev;
        room.paras.push(para);
      } else if (data.type === 'student') {
        const student = [...STUDENTS, ...extraStudents].find(s => s.id === data.id);
        if (!student) return prev;
        if (next.some(r => r.students.some(s => s.id === student.id))) return prev;
        room.students.push(student);
      }

      return next;
    });
  }, [extraStudents, extraTeachers]);

  const handleRemoveTeacher = useCallback((roomId) => {
    setClassrooms(prev => prev.map(r => r.id === roomId ? {...r, teacher:null, paras:[...r.paras], students:[...r.students]} : r));
  }, []);

  const handleRemovePara = useCallback((roomId, paraId) => {
    setClassrooms(prev => prev.map(r => r.id === roomId ? {...r, teacher:r.teacher, paras:r.paras.filter(p => p.id !== paraId), students:[...r.students]} : r));
  }, []);

  const handleRemoveStudent = useCallback((roomId, studentId) => {
    setClassrooms(prev => prev.map(r => r.id === roomId ? {...r, teacher:r.teacher, paras:[...r.paras], students:r.students.filter(s => s.id !== studentId)} : r));
  }, []);

  const handleReset = useCallback(() => {
    setClassrooms(initClassrooms());
    setAbsentStudents(new Set());
    setExtraStudents([]);
    setExtraTeachers([]);
    setSubsUsed(new Set());
    setEnrollmentCount(BASE_ENROLLMENT);
    setCrisisBanner(null);
    setSolverInfo(null);
    setOptimizerLabel('RUN OPTIMIZER');
  }, []);

  // ── SCENARIO 1: Teacher Absence ──
  const handleTeacherAbsent = useCallback((roomId) => {
    setClassrooms(prev => prev.map(r => r.id === roomId ? {...r, teacher:null, paras:[...r.paras], students:[...r.students]} : r));
  }, []);

  const handleAutoCover = useCallback((roomId) => {
    const room = classrooms.find(r => r.id === roomId);
    if (!room || room.teacher) return;
    // Find best available sub
    const avail = SUBS.filter(s => !subsUsed.has(s.id) && !assignedTeachers.has(s.id));
    if (avail.length === 0) return;
    // Pick sub with best cert match for current students
    const hasIEP = room.students.some(s => s.tags.includes('IEP'));
    const hasESL = room.students.some(s => s.tags.includes('ESL'));
    let best = avail[0];
    for (const sub of avail) {
      let score = 0;
      if (hasIEP && sub.certs.includes('SpEd')) score += 10;
      if (hasESL && (sub.certs.includes('ESL') || sub.certs.includes('Bilingual'))) score += 5;
      let bestScore = 0;
      if (hasIEP && best.certs.includes('SpEd')) bestScore += 10;
      if (hasESL && (best.certs.includes('ESL') || best.certs.includes('Bilingual'))) bestScore += 5;
      if (score > bestScore) best = sub;
    }
    setSubsUsed(prev => new Set([...prev, best.id]));
    setClassrooms(prev => prev.map(r => r.id === roomId ? {...r, teacher: best, paras:[...r.paras], students:[...r.students]} : r));
  }, [classrooms, subsUsed, assignedTeachers]);

  const handleSplitClass = useCallback((roomId) => {
    setClassrooms(prev => {
      const next = prev.map(r => ({...r, teacher:r.teacher, paras:[...r.paras], students:[...r.students]}));
      const room = next.find(r => r.id === roomId);
      if (!room || room.students.length === 0) return prev;
      const studentsToSplit = [...room.students];
      room.students = [];
      room.paras = [];
      // Distribute students to other rooms with teachers
      const otherRooms = next.filter(r => r.id !== roomId && r.teacher);
      studentsToSplit.forEach((student, i) => {
        if (otherRooms.length > 0) {
          const target = otherRooms[i % otherRooms.length];
          target.students.push(student);
        }
      });
      return next;
    });
  }, []);

  // ── SCENARIO 2: Mid-Year Enrollment ──
  const handleEnrollStudent = useCallback((isBirthday) => {
    const newStudent = generateRandomStudent(isBirthday);
    setExtraStudents(prev => [...prev, newStudent]);
    setEnrollmentCount(prev => prev + 1);
    // Check if crisis
    const teacherRooms = classrooms.filter(r => r.teacher);
    const allFull = teacherRooms.length > 0 && teacherRooms.every(r => {
      const type = getRoomType(r);
      const cap = type === 'IEP_ONLY' ? 13 : 20;
      return r.students.length >= cap;
    });
    if (allFull) {
      setCrisisBanner('Enrollment Crisis — All classrooms at capacity! New hire may be required.');
    }
  }, [classrooms]);

  const handleHireTeacher = useCallback(() => {
    const hireNum = extraTeachers.length + 1;
    const newTeacher = {
      id: 'hired' + hireNum,
      name: `Ms. New${hireNum}`,
      certs: ['Early Childhood'],
      contractCap: 20,
      willingness: 3,
      isNew: true,
    };
    setExtraTeachers(prev => [...prev, newTeacher]);
    setCrisisBanner(null);
  }, [extraTeachers]);

  // ── SCENARIO 3: Student Absence Toggle ──
  const handleToggleStudentAbsent = useCallback((studentId) => {
    setAbsentStudents(prev => {
      const next = new Set(prev);
      if (next.has(studentId)) next.delete(studentId);
      else next.add(studentId);
      return next;
    });
  }, []);

  const handleOptimize = useCallback(async (overrideWeights) => {
    if (optimizing) return;
    setOptimizing(true);
    
    const activeWeights = (overrideWeights && !overrideWeights.nativeEvent) ? overrideWeights : weights;
    const isReoptimization = classrooms.some(r => r.students.length > 0);
    const currentClassrooms = JSON.parse(JSON.stringify(classrooms));
    
    setClassrooms(initClassrooms());
    setSolverInfo(null);
    setOptimizerLabel('Formulating model...');

    const statusCb = (phase) => {
      if (phase === 'formulating') setOptimizerLabel('Formulating model...');
      else if (phase === 'solving') setOptimizerLabel('Running B&B solver...');
      else if (phase === 'placing') setOptimizerLabel('Placing students...');
      else if (phase === 'fallback') setOptimizerLabel('Using fast heuristic...');
    };

    let result;
    try {
      result = await optimizeAssignmentGP(allTeachers, PARAS, allStudents, statusCb, activeWeights, isReoptimization, currentClassrooms);
    } catch (e) {
      console.error('GP solver error:', e);
      const rooms = heuristicAssignment(allTeachers, PARAS, allStudents, activeWeights, currentClassrooms, isReoptimization);
      result = { rooms, solverResult: { status: 'FALLBACK', reason: e.message, varCount: 0, constraintCount: 0 } };
    }

    const { rooms: optimized, solverResult } = result;
    setSolverInfo(solverResult);
    setOptimizerLabel(solverResult.status === 'OPTIMAL' ? 'Optimal solution found' :
                       solverResult.status === 'FEASIBLE' ? 'Feasible solution found' :
                       'Heuristic solution (fallback)');

    const steps = [];
    // Build animation steps: first teachers, then paras, then students
    optimized.forEach((room, ri) => {
      if (room.teacher) {
        steps.push({ type: 'teacher', roomIdx: ri, data: room.teacher, delay: ri * 80 });
      }
    });
    optimized.forEach((room, ri) => {
      room.paras.forEach((para, pi) => {
        steps.push({ type: 'para', roomIdx: ri, data: para, delay: (allTeachers.length * 80) + (ri * 5 + pi) * 80 });
      });
    });
    optimized.forEach((room, ri) => {
      room.students.forEach((student, si) => {
        steps.push({ type: 'student', roomIdx: ri, data: student, delay: ((allTeachers.length + PARAS.length) * 80) + (ri * allStudents.length + si) * 60 });
      });
    });

    steps.forEach((step, i) => {
      setTimeout(() => {
        setClassrooms(prev => {
          const next = prev.map(r => ({...r, teacher: r.teacher, paras:[...r.paras], students:[...r.students]}));
          const room = next[step.roomIdx];
          if (step.type === 'teacher') room.teacher = step.data;
          else if (step.type === 'para') room.paras.push(step.data);
          else room.students.push(step.data);
          return next;
        });
        if (scoreRef.current) {
          scoreRef.current.classList.remove('dropping');
          void scoreRef.current.offsetWidth;
          scoreRef.current.classList.add('dropping');
        }
        if (i === steps.length - 1) {
          setTimeout(() => setOptimizing(false), 500);
        }
      }, step.delay);
    });
  }, [optimizing]);

  const penaltyColor = displayPenalty > 70 ? '#ef4444' : displayPenalty > 40 ? '#f97316' : displayPenalty > 15 ? '#eab308' : '#22c55e';
  const penaltyPct = displayPenalty;

  return (
    <>
      <header className="app-header">
        <div className="header-bar"></div>
        <div className="header-text-group">
          <h1>CLASSROOMIQ</h1>
          <div className="subtitle">Goal Programming Simulator <span style={{opacity:0.5, margin:'0 6px'}}>|</span> Interactive Demo</div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',gap:'12px',alignItems:'center'}}>
          <span className="enrollment-counter">Enrollment: {enrollmentCount} / 450</span>
          <div className="stat-pill">{unassignedTeachers} teachers left</div>
          <div className="stat-pill">{PARAS.length - assignedParas.size} paras left</div>
          <div className="stat-pill">{unassignedStudents} students left</div>
          {absentStudents.size > 0 && <div className="stat-pill" style={{background:'#fee2e2',color:'#dc2626'}}>{absentStudents.size} absent</div>}
        </div>
      </header>

      <div className="app-container">
        {/* LEFT PANEL */}
        <div className="left-panel">
          <div className="resource-section">
            <div className="panel-title">TEACHERS — {unassignedTeachers}</div>
            {allTeachers.map(t => (
              <TeacherCard key={t.id} teacher={t} assigned={assignedTeachers.has(t.id)} />
            ))}
          </div>

          {availableSubs.length > 0 && (
            <div className="sub-pool">
              <div className="sub-pool-title">SUBSTITUTES — {availableSubs.length}</div>
              {availableSubs.map(t => (
                <TeacherCard key={t.id} teacher={t} assigned={assignedTeachers.has(t.id)} />
              ))}
            </div>
          )}

          <div className="section-divider" />
          <div className="resource-section">
            <div className="panel-title">
              PARAPROFESSIONALS — {PARAS.length - assignedParas.size}
              <span style={{color: 'var(--slate-light)', fontSize: '0.58rem', textTransform: 'lowercase'}}>  ·  bilingual = ability</span>
            </div>
            {PARAS.map(p => (
              <ParaCard key={p.id} para={p} assigned={assignedParas.has(p.id)} />
            ))}
          </div>
          <div className="section-divider" />
          <div className="resource-section">
            <div className="panel-title">STUDENTS — {unassignedStudents}</div>
            {allStudents.map(s => (
              <StudentCard key={s.id} student={s} assigned={assignedStudents.has(s.id)} />
            ))}
          </div>

          <div className="section-divider" />
          <div className="resource-section">
            <div className="panel-title">ENROLLMENT SCENARIOS</div>
            <button className="btn-enroll" onClick={() => handleEnrollStudent(false)}>NEW STUDENT ENROLLS</button>
            <button className="btn-enroll" style={{background:'linear-gradient(135deg,#eab308,#facc15)',marginTop:4}} onClick={() => handleEnrollStudent(true)}>3RD BIRTHDAY IEP ENROLL</button>
            {crisisBanner && <button className="btn-hire" style={{marginTop:4}} onClick={handleHireTeacher}>HIRE NEW TEACHER</button>}
          </div>
        </div>

        {/* CENTER PANEL */}
        <div className="center-panel">
          <div className="classroom-grid">
            {classrooms.map(room => (
              <ClassroomSlot
                key={room.id}
                room={room}
                onDrop={handleDrop}
                onRemoveTeacher={handleRemoveTeacher}
                onRemovePara={handleRemovePara}
                onRemoveStudent={handleRemoveStudent}
                onTeacherAbsent={handleTeacherAbsent}
                onAutoCover={handleAutoCover}
                onSplitClass={handleSplitClass}
                onToggleStudentAbsent={handleToggleStudentAbsent}
                absentStudents={absentStudents}
              />
            ))}
          </div>
        </div>

        {/* RIGHT PANEL */}
        <div className="right-panel">
          <div className="penalty-meter">
            <div className="penalty-label">OBJECTIVE Z</div>
            <div className="penalty-score" ref={scoreRef}>{displayPenalty}</div>
            <div className="penalty-sublabel">minimize weighted deviations</div>
            <div className="penalty-bar-outer">
              <div className="penalty-bar-inner" style={{width:`${penaltyPct}%`, background: penaltyColor}} />
            </div>
          </div>

          <div className="breakdown-section">
            <div className="breakdown-title">BREAKDOWN</div>
            <BreakdownBar label="Ratio Imbalance" value={penalty.ratioImbalance} max={25} color="#6366f1" />
            <BreakdownBar label="Gender Imbalance" value={penalty.genderImbalance} max={25} color="#ec4899" />
            <BreakdownBar label="High-Needs Concentration" value={penalty.highNeeds} max={25} color="#f97316" />
            <BreakdownBar label="IEP Spread" value={penalty.iepSpread} max={25} color="#ef4444" />
            <BreakdownBar label="Bilingual Match" value={penalty.bilingualMatch} max={25} color="#8b5cf6" />
            <BreakdownBar label="Rocks in Bags  (at-risk balance)" value={penalty.atRiskBalance} max={25} color="#10b981" />
            <BreakdownBar label="Inclusion" value={penalty.inclusionPenalty} max={25} color="#14b8a6" />
            <BreakdownBar label="Reluctant Staff" value={penalty.reluctancePenalty} max={25} color="#0ea5e9" />
          </div>

          {unassignedStudents > 0 && (
            <div style={{
              background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:'8px',
              padding:'8px 10px',fontSize:'.7rem',fontWeight:700,color:'#92400e',textAlign:'center'
            }}>
              CRITICAL: {unassignedStudents} student{unassignedStudents > 1 ? 's' : ''} unassigned — penalty stays at max
            </div>
          )}

          {crisisBanner && (
            <div className="crisis-banner">{crisisBanner}</div>
          )}

          <div className="action-buttons">
            <button className={`btn btn-optimize ${optimizing ? 'running' : ''}`} onClick={handleOptimize}>
              {optimizing ? optimizerLabel : optimizerLabel}
            </button>
            <button className="btn btn-reset" onClick={handleReset}>
              RESET
            </button>
            <button className="btn-model" onClick={() => setShowFormulation(true)}>
              VIEW MODEL
            </button>
          </div>

          {solverInfo && (
            <div className="solver-status">
              <div className="ss-row"><span className="ss-label">Solver</span><span className="ss-value">{solverInfo.solver || 'Greedy Heuristic'}</span></div>
              <div className="ss-row"><span className="ss-label">Status</span><span className={`ss-value ${solverInfo.status === 'OPTIMAL' ? 'optimal' : solverInfo.status === 'FALLBACK' ? 'fallback' : ''}`}>{solverInfo.status === 'OPTIMAL' ? 'Optimal' : solverInfo.status === 'FEASIBLE' ? 'Feasible' : solverInfo.status === 'INFEASIBLE' ? 'Infeasible' : 'Fallback'}</span></div>
              {solverInfo.z !== undefined && <div className="ss-row"><span className="ss-label">Objective Z</span><span className="ss-value">{solverInfo.z.toFixed(2)}</span></div>}
              <div className="ss-row"><span className="ss-label">Binary Vars</span><span className="ss-value">{solverInfo.varCount}</span></div>
              <div className="ss-row"><span className="ss-label">Constraints</span><span className="ss-value">{solverInfo.constraintCount}</span></div>
            </div>
          )}

          <div className="scenario-section">
            <div className="scenario-title">SCENARIOS</div>
            <div style={{fontSize:'.6rem',color:'#78350f',lineHeight:'1.5'}}>
              <strong>Teacher Absent</strong> — Click the "Absent" button on any assigned teacher to trigger a coverage crisis.<br/>
              <strong>New Enrollment</strong> — Use the left panel buttons to add students mid-year. Birthday students get IEP rights.<br/>
              <strong>Student Absent</strong> — Click any student chip in a classroom to toggle absence. Watch the ratio improve!<br/>
              <strong>Mid-Year Re-Optimize</strong> — After new enrollments, re-run the optimizer. G7 (w={weights.w7}) penalizes moving existing students to preserve long-term relationships.
            </div>
          </div>
        </div>
      </div>

      {showFormulation && (
        <div className="formulation-overlay" onClick={() => setShowFormulation(false)}>
          <div className="formulation-modal" onClick={e => e.stopPropagation()} style={{maxWidth: '800px'}}>
            <button className="fm-close" onClick={() => setShowFormulation(false)}>✕</button>
            <h2>GOAL PROGRAMMING MODEL</h2>
            <div className="fm-sub">Stage 1 ILP (GLPK WebAssembly) + Stage 2 Student Placement</div>

            <div style={{ background: '#1e293b', padding: '15px', borderRadius: '8px', marginBottom: '20px', border: '1px solid #334155' }}>
              <h3 style={{ margin: '0 0 10px 0', fontSize: '0.9rem', color: '#94a3b8' }}>WEIGHT SENSITIVITY ANALYSIS</h3>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '15px' }}>
                {[
                  { k:'w1', l:'SpEd Coverage' }, { k:'w2', l:'ESL Coverage' },
                  { k:'w3', l:'Bil. Para' }, { k:'w4', l:'Para Count' },
                  { k:'w5', l:'At-Risk Bal' }, { k:'w6', l:'Inclusion' },
                  { k:'w7', l:'Continuity' }, { k:'w8', l:'Willingness' }
                ].map(({k, l}) => (
                  <div key={k} style={{ display: 'flex', flexDirection: 'column', gap: '5px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', color: '#cbd5e1' }}>
                      <span>{l} (<span className="fm-var">{k}</span>)</span>
                      <span className="fm-weight">{weights[k]}</span>
                    </div>
                    <input type="range" min="0" max="20" value={weights[k]} onChange={(e) => {
                       const newW = {...weights, [k]: parseInt(e.target.value)};
                       setWeights(newW);
                    }} style={{ width: '100%', cursor: 'pointer', accentColor: '#f59e0b' }} />
                  </div>
                ))}
              </div>
              <button 
                onClick={() => handleOptimize(weights)} 
                className="btn-model"
                style={{marginTop:'12px', width:'100%', display:'block'}}>
                ↺ Re-optimize with current weights
              </button>
            </div>

            <pre><span className="fm-comment">{'// Objective: minimize weighted sum of deviation variables and penalties'}</span>{'\n'}
<span className="fm-keyword">min</span> <span className="fm-var">Z</span> = <span className="fm-weight">{weights.w1}</span>·<span className="fm-var">d⁻₁</span> + <span className="fm-weight">{weights.w2}</span>·<span className="fm-var">d⁻₂</span> + <span className="fm-weight">{weights.w3}</span>·<span className="fm-var">d⁻₃</span> + <span className="fm-weight">{weights.w4}</span>·<span className="fm-var">d⁻₄</span> + <span className="fm-weight">{weights.w5}</span>·Σ<span className="fm-var">d_risk[r]</span> + <span className="fm-weight">{weights.w6}</span>·Σ<span className="fm-var">iso[r]</span> + <span className="fm-weight">{weights.w7}</span>·<span className="fm-var">cont</span> + <span className="fm-weight">{weights.w8}</span>·<span className="fm-var">reluct</span></pre>

            <div className="fm-divider" />

            <pre><span className="fm-comment">{'// Stage 1: ILP Hard Constraints (Staff Assignment)'}</span>{'\n'}
<span className="fm-constraint">[C1]</span> Σᵣ <span className="fm-var">x[t][r]</span> = 1        ∀t  <span className="fm-comment">{'// each teacher → exactly one room'}</span>{'\n'}
<span className="fm-constraint">[C2]</span> Σₜ <span className="fm-var">x[t][r]</span> ≤ 1        ∀r  <span className="fm-comment">{'// at most one teacher per room'}</span>{'\n'}
<span className="fm-constraint">[C3]</span> Σᵣ <span className="fm-var">p[a][r]</span> = 1        ∀a  <span className="fm-comment">{'// each para → exactly one room'}</span>{'\n'}
<span className="fm-constraint">[C4]</span> <span className="fm-var">x[t][r]</span> = 0 if ¬EC[t]  <span className="fm-comment">{'// Early Childhood cert required'}</span></pre>

            <div className="fm-divider" />

            <pre><span className="fm-comment">{'// Stage 1: Goal Constraints (Staff Assignment)'}</span>{'\n'}
<span className="fm-constraint">[G1]</span> Σₜ <span className="fm-var">x[t][r]</span>·SpEd[t] + <span className="fm-var">d⁻₁</span> ≥ 1   ∀IEP_r  <span className="fm-comment">{'// SpEd coverage'}</span>{'\n'}
<span className="fm-constraint">[G2]</span> Σ(<span className="fm-var">x[t][r]</span>·ESL[t] + <span className="fm-var">p[a][r]</span>·bil[a]) + <span className="fm-var">d⁻₂</span> ≥ 1  ∀ESL_r  <span className="fm-comment">{'// ESL coverage'}</span>{'\n'}
<span className="fm-constraint">[G3]</span> Σₐ <span className="fm-var">p[a][r]</span>·bil[a] + <span className="fm-var">d⁻₃</span> ≥ 1    ∀BIL_r  <span className="fm-comment">{'// Bilingual para'}</span>{'\n'}
<span className="fm-constraint">[G4]</span> Σₐ <span className="fm-var">p[a][r]</span> + <span className="fm-var">d⁻₄</span> ≥ req[r]      ∀r  <span className="fm-comment">{'// Individual Para staffing'}</span></pre>

            <div className="fm-divider" />

            <pre><span className="fm-comment">{'// Stage 2: Component Student Assignment Constraints & Goals'}</span>{'\n'}
<span className="fm-constraint">[C5]</span> |students in r| ≤ TeacherCap[t]  ∀r  <span className="fm-comment">{'// Union capacity limit'}</span>{'\n'}
<span className="fm-constraint">[C6]</span> Turn-3 IEP student mandatory placement BypassFeasibilityCheck = True{'\n'}
<span className="fm-constraint">[G5]</span> <span className="fm-var">d_risk[r]</span> = | Σ atRiskScore - IdealRiskSum |  <span className="fm-comment">{'// \'Rocks in Bags\' — equal at-risk point load per classroom'}</span>{'\n'}
<span className="fm-constraint">[G6]</span> <span className="fm-var">iso[r]</span> ∈ {'{'}0,1{'}'} (1 if 100% IEP)  <span className="fm-comment">{'// Inclusion preference'}</span>{'\n'}
<span className="fm-constraint">[G7]</span> <span className="fm-var">cont</span> = Σ (student moved to different room)  <span className="fm-comment">{'// Mid-year continuity'}</span>{'\n'}
<span className="fm-constraint">[G8]</span> <span className="fm-var">reluct</span> = Σ (3 - willingness) for rooms with highNeeds &gt; 3  <span className="fm-comment">{'// Reluctant staff — willingness score < 3 in high-needs rooms'}</span></pre>
          </div>
        </div>
      )}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
